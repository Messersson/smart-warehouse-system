name: warehouse-system

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smart-warehouse-backend:latest
    container_name: warehouse-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql-8
      DB_PORT: 3306
      DB_NAME: warehouse_system
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      WMS_TOKEN_SECRET: ${WMS_TOKEN_SECRET:?WMS_TOKEN_SECRET is required}
      WMS_TOKEN_EXPIRATION_MINUTES: ${WMS_TOKEN_EXPIRATION_MINUTES:-720}
      WMS_CORS_ALLOWED_ORIGINS: ${WMS_CORS_ALLOWED_ORIGINS:-https://warehouse.oneais.dev}
      WMS_APPROVAL_AUTO_APPROVE: ${WMS_APPROVAL_AUTO_APPROVE:-true}
    ports:
      - "18080:8080"
    networks:
      - default
      - warehouse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: smart-warehouse-frontend:latest
    container_name: warehouse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "12345:80"

networks:
  warehouse-net:
    external: true
